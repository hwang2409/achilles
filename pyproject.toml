[project]
name = "achilles"
version = "0.1.0"
description = "a small control plane for agent products and judges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
achilles = "achilles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/achilles"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
