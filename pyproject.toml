[project]
name = "achilles"
version = "0.1.0"
description = "a small control plane for agent products and judges"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40,<1", "uvicorn>=0.32,<1"]

[project.scripts]
achilles = "achilles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/achilles"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
