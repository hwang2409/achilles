name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < fulcrum.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          ref: ${{ steps.pin.outputs.sha }}
          path: fulcrum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: fulcrum
      - run: bun test ./scripts/
      - run: bun scripts/fulcrum.ts
        env:
          FULCRUM_DIR: ${{ github.workspace }}/fulcrum
      - run: bun test ./apps/web/src/
      - run: bun run typecheck
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - id: zeta-pin
        run: echo "sha=$(tr -d '[:space:]' < zeta.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/zeta
          ref: ${{ steps.zeta-pin.outputs.sha }}
          path: .cache/zeta
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --project .cache/zeta --frozen
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun test ./scripts/eval*.test.ts
      - run: |
          set +e
          EVAL_BACKEND=scripted EVAL_SETUP_ONLY=1 REPORT_DIR=.cache/eval-ci-setup bun scripts/eval.ts
          status=$?
          set -e
          STATUS=$status python - <<'PY'
          import json, os
          from pathlib import Path
          expected = sorted(path.stem for path in Path('evals/tasks').glob('*.json'))
          report = json.loads(Path('.cache/eval-ci-setup/report.json').read_text())
          actual = sorted(task['task_id'] for task in report['tasks'])
          assert actual == expected, (actual, expected)
          if int(os.environ['STATUS']):
              print([(task['task_id'], task['status'], task['checks']) for task in report['tasks'] if not task['pass']])
          raise SystemExit(int(os.environ['STATUS']))
          PY
      - name: eval setup accepts the baseline achilles revision
        run: |
          git fetch --depth=1 origin 1fe26f74991a8ea78dd0e2b551bdb5125e1f542e
          git worktree add --detach .cache/achilles-baseline 1fe26f74991a8ea78dd0e2b551bdb5125e1f542e
          EVAL_BACKEND=scripted EVAL_SETUP_ONLY=1 ACHILLES_DIR="$PWD/.cache/achilles-baseline" REPORT_DIR=.cache/eval-ci-baseline-setup bun scripts/eval.ts
      - run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          env = {**os.environ, 'EVAL_BACKEND': 'scripted', 'EVAL_SKIP_EXPLICIT_EXIT': '1', 'REPORT_DIR': '.cache/eval-ci-success'}
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'judge-page-and-annotate'], env=env, timeout=30)
          report = json.loads((Path('.cache/eval-ci-success') / 'report.json').read_text())
          if any(check['id'] == 'harness' for task in report['tasks'] for check in task['checks']):
              raise AssertionError('judge page-switch harness failure')
          if result.returncode not in (0, 1):
              raise SystemExit(result.returncode)

          env.update({'EVAL_SKIP_CREATE_PAGE': '1', 'REPORT_DIR': '.cache/eval-ci-missing-page'})
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'judge-page-and-annotate'], env=env, timeout=30)
          report = json.loads((Path('.cache/eval-ci-missing-page') / 'report.json').read_text())
          task = report['tasks'][0]
          assert result.returncode == 1
          assert task['status'] == 'agent_fail', task
          snapshot = json.loads((Path('.cache/eval-ci-missing-page') / task['transcript']).read_text())
          assert snapshot['session_history'], snapshot

          env.pop('EVAL_SKIP_CREATE_PAGE')
          env['REPORT_DIR'] = '.cache/eval-ci-reconnect'
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'reconnect-recovery'], env=env, timeout=30)
          report = json.loads((Path('.cache/eval-ci-reconnect') / 'report.json').read_text())
          assert result.returncode == 0, report['tasks'][0]
          assert report['tasks'][0]['status'] == 'pass'
          PY
      - name: scripted eval forced error cleans up
        run: |
          if EVAL_BACKEND=scripted EVAL_FORCE_ERROR=1 REPORT_DIR=.cache/eval-ci-error bun scripts/eval.ts --suite create-and-use-tool-same-chat; then
            echo "forced provider error unexpectedly passed" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, re, socket
          from pathlib import Path
          root = Path('.cache/eval-ci-error')
          report = json.loads((root / 'report.json').read_text())
          assert report['tasks'] and not report['tasks'][0]['pass']
          proofs = json.loads((root / 'cleanup.json').read_text())
          assert proofs and all(p['pids_dead'] and p['pgids_dead'] and p['ports_closed'] and p['discovery_pid_dead'] and p['discovery_cleaned'] for p in proofs)
          for proof in proofs:
              for pid in proof['pids']:
                  try: os.kill(pid, 0)
                  except ProcessLookupError: pass
                  else: raise AssertionError(f'child pid {pid} remains')
              for port in proof['ports']:
                  with socket.socket() as probe:
                      probe.settimeout(0.2)
                      assert probe.connect_ex(('127.0.0.1', port)) != 0, f'port {port} remains open'
          assert not list(root.rglob('serve.ws.json'))
          text = '\n'.join(path.read_text(errors='ignore') for path in root.rglob('*') if path.is_file())
          assert not re.search(r'Bearer\\s+[A-Za-z0-9._~+/=-]{12,}|sk-[A-Za-z0-9_-]{16,}', text, re.I)
          PY
      - run: bun run ../../scripts/real-zeta-gate.ts
        env:
          ZETA_CHECKOUT: ${{ github.workspace }}/.cache/zeta
        working-directory: apps/web

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: uv sync --group test
      - run: uv run pytest
      - run: bun test ./scripts/
