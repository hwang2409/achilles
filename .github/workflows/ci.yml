name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < fulcrum.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          ref: ${{ steps.pin.outputs.sha }}
          path: .cache/fulcrum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: .cache/fulcrum
      - run: bun test ./scripts/
      - run: bun scripts/fulcrum.ts
        env:
          FULCRUM_DIR: ${{ github.workspace }}/.cache/fulcrum
      - run: bun test --preload ./apps/web/src/test-dom.ts ./apps/web/src/
      - run: bun run typecheck
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web

  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-checks
      - run: bun run ../../scripts/real-zeta-gate.ts
        env:
          ZETA_CHECKOUT: ${{ github.workspace }}/.cache/zeta
        working-directory: apps/web
      - name: upload real-zeta gate logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-zeta-gate-logs
          path: .cache/gate-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-browser-checks
      - name: eval make target prepares fresh web dependencies
        timeout-minutes: 2
        run: |
          rm -rf apps/web/node_modules/@fulcrum
          EVAL_BACKEND=scripted EVAL_SETUP_ONLY=1 EVAL_SKIP_BROWSER_INSTALL=1 BASE=none REPORT_DIR=.cache/eval-ci-make-setup make eval TASK=harness-smoke
      - run: bun test ./scripts/eval*.test.ts
      - name: render_page with real chromium
        run: uv sync --group test && uv run pytest tests/test_render_page.py
        env:
          ACHILLES_RENDER_TESTS: required
      - timeout-minutes: 10
        run: |
          set +e
          EVAL_BACKEND=scripted EVAL_SETUP_ONLY=1 BASE=none REPORT_DIR=.cache/eval-ci-setup bun scripts/eval.ts
          status=$?
          set -e
          STATUS=$status python - <<'PY'
          import json, os
          from pathlib import Path
          tasks = [json.loads(path.read_text()) for path in Path('evals/tasks').glob('*.json')]
          expected = sorted(task['id'] for task in tasks if task.get('suite', 'focused') == 'core')
          report = json.loads(Path('.cache/eval-ci-setup/report.json').read_text())
          actual = sorted(task['task_id'] for task in report['tasks'])
          assert actual == expected, (actual, expected)
          if int(os.environ['STATUS']):
              print([(task['task_id'], task['status'], task['checks']) for task in report['tasks'] if not task['pass']])
          raise SystemExit(int(os.environ['STATUS']))
          PY
      - name: eval setup accepts the baseline achilles revision
        timeout-minutes: 10
        run: |
          git fetch --depth=1 origin a5a8ea4a8c26635d7bb9dae1da23e3272b8cc6c7
          git worktree add --detach .cache/achilles-baseline a5a8ea4a8c26635d7bb9dae1da23e3272b8cc6c7
          # earlier steps let the pinned zeta create ~/.zeta at its storage epoch; an older baseline zeta refuses a newer home
          ZETA_HOME="$RUNNER_TEMP/baseline-zeta-home" EVAL_BACKEND=scripted EVAL_SETUP_ONLY=1 ACHILLES_DIR="$PWD/.cache/achilles-baseline" BASE=none REPORT_DIR=.cache/eval-ci-baseline-setup bun scripts/eval.ts
      - run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          env = {**os.environ, 'EVAL_BACKEND': 'scripted', 'EVAL_SKIP_EXPLICIT_EXIT': '1', 'REPORT_DIR': '.cache/eval-ci-success', 'BASE': 'none'}
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'harness-smoke'], env=env, timeout=30)
          report = json.loads((Path('.cache/eval-ci-success') / 'report.json').read_text())
          if any(check['id'] == 'harness' for task in report['tasks'] for check in task['checks']):
              raise AssertionError('code-page smoke harness failure')
          if result.returncode not in (0, 1):
              raise SystemExit(result.returncode)

          env['REPORT_DIR'] = '.cache/eval-ci-browser'
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'browser-controller-slot'], env=env, timeout=30)
          report = json.loads((Path('.cache/eval-ci-browser') / 'report.json').read_text())
          assert result.returncode == 0, report['tasks'][0]
          assert report['tasks'][0]['status'] == 'pass'

          index = Path('apps/web/dist/index.html')
          original = index.read_text()
          index.write_text(original.replace('</body>', '<p role="status">loading chat…</p></body>'))
          env['REPORT_DIR'] = '.cache/eval-ci-browser-loading'
          try:
              result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'browser-controller-slot'], env=env, timeout=30)
          finally:
              index.write_text(original)
          report = json.loads((Path('.cache/eval-ci-browser-loading') / 'report.json').read_text())
          task = report['tasks'][0]
          assert result.returncode == 1
          assert task['status'] == 'harness_error', task
          assert 'browser page did not become ready' in task['checks'][0]['evidence']['message'], task

          env['REPORT_DIR'] = '.cache/eval-ci-missing-page'
          env['EVAL_SKIP_CREATE_PAGE'] = '1'
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'browser-controller-slot'], env=env, timeout=30)
          env.pop('EVAL_SKIP_CREATE_PAGE')
          report = json.loads((Path('.cache/eval-ci-missing-page') / 'report.json').read_text())
          task = report['tasks'][0]
          assert result.returncode == 1
          assert task['status'] == 'agent_fail', task
          assert task['turns'] > 0, task
          assert task['tool_calls'] > 0, task
          assert task['wall_ms'] > 0, task
          assert task['usage'] != 'unavailable', task
          snapshot = json.loads((Path('.cache/eval-ci-missing-page') / task['transcript']).read_text())
          assert snapshot['session_history'], snapshot

          env['REPORT_DIR'] = '.cache/eval-ci-reconnect'
          result = subprocess.run(['bun', 'scripts/eval.ts', '--suite', 'reconnect-recovery'], env=env, timeout=30)
          report = json.loads((Path('.cache/eval-ci-reconnect') / 'report.json').read_text())
          assert result.returncode == 0, report['tasks'][0]
          assert report['tasks'][0]['status'] == 'pass'
          PY
      - name: scripted eval forced error cleans up
        run: |
          if EVAL_BACKEND=scripted EVAL_FORCE_ERROR=1 BASE=none REPORT_DIR=.cache/eval-ci-error bun scripts/eval.ts --suite create-and-use-tool-same-chat; then
            echo "forced provider error unexpectedly passed" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os, re, socket
          from pathlib import Path
          root = Path('.cache/eval-ci-error')
          report = json.loads((root / 'report.json').read_text())
          assert report['tasks'] and not report['tasks'][0]['pass']
          proofs = json.loads((root / 'cleanup.json').read_text())
          assert proofs and all(p['pids_dead'] and p['pgids_dead'] and p['ports_closed'] and p['discovery_pid_dead'] and p['discovery_cleaned'] for p in proofs)
          for proof in proofs:
              for pid in proof['pids']:
                  try: os.kill(pid, 0)
                  except ProcessLookupError: pass
                  else: raise AssertionError(f'child pid {pid} remains')
              for port in proof['ports']:
                  with socket.socket() as probe:
                      probe.settimeout(0.2)
                      assert probe.connect_ex(('127.0.0.1', port)) != 0, f'port {port} remains open'
          assert not list(root.rglob('serve.ws.json'))
          text = '\n'.join(path.read_text(errors='ignore') for path in root.rglob('*') if path.is_file())
          assert not re.search(r'Bearer\\s+[A-Za-z0-9._~+/=-]{12,}|sk-[A-Za-z0-9_-]{16,}', text, re.I)
          PY

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < fulcrum.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          ref: ${{ steps.pin.outputs.sha }}
          path: .cache/fulcrum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: .cache/fulcrum
      - run: bun scripts/fulcrum.ts
        env:
          FULCRUM_DIR: ${{ github.workspace }}/.cache/fulcrum
      - run: uv sync --group test
      - run: uv run pytest
      - run: bun test ./scripts/
