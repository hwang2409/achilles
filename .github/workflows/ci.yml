name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < fulcrum.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          ref: ${{ steps.pin.outputs.sha }}
          path: fulcrum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: fulcrum
      - run: bun scripts/fulcrum.ts
        env:
          FULCRUM_DIR: ${{ github.workspace }}/fulcrum
      - run: bun run typecheck
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: bun x playwright install chromium
        working-directory: apps/web
      - run: |
          tmp=$(mktemp -d)
          python fixtures/notify/server.py --socket "$tmp/notify.sock" --record "$tmp/record.json" > "$tmp/notify.log" &
          while ! grep -q '"ready": true' "$tmp/notify.log"; do sleep 0.1; done
          uv run achilles run --once --manifest fixtures/one-trace/achilles.toml --fixture fixtures/one-trace/trace.json --db "$tmp/db" --notify-socket "$tmp/notify.sock"
          uv run achilles serve --db "$tmp/db" --web-root apps/web/dist --port 0 > "$tmp/web.log" &
          while ! grep -q '"ready": true' "$tmp/web.log"; do sleep 0.1; done
          port=$(python -c 'import json; print(json.load(open("'"$tmp"'/web.log"))["port"])')
          ACHILLES_URL="http://127.0.0.1:$port" bun run apps/web/tests/dashboard.browser.ts

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: uv run pytest
