name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < fulcrum.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/fulcrum
          ref: ${{ steps.pin.outputs.sha }}
          path: fulcrum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: fulcrum
      - run: bun scripts/fulcrum.ts
        env:
          FULCRUM_DIR: ${{ github.workspace }}/fulcrum
      - run: bun run typecheck
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - id: zeta-pin
        run: echo "sha=$(tr -d '[:space:]' < zeta.rev)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hwang2409/zeta
          ref: ${{ steps.zeta-pin.outputs.sha }}
          path: zeta
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --project zeta --frozen
      - run: bunx playwright install --with-deps chromium
      - run: bun run ../../scripts/real-zeta-gate.ts
        working-directory: apps/web

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --group test
      - run: uv run pytest
